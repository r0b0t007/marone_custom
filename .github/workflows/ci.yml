name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-marone_custom-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server tests (version-16)

    services:
      redis-cache:
        image: redis:8-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:8-alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Checkout marone_custom
        uses: actions/checkout@v6
        with:
          path: apps/marone_custom

      - name: Checkout morocco_localization
        uses: actions/checkout@v6
        with:
          repository: r0b0t007/morocco_localization
          path: apps/morocco_localization
          token: ${{ secrets.APPS_READ_TOKEN }}

      - name: Checkout trade_import
        uses: actions/checkout@v6
        with:
          repository: r0b0t007/trade_import
          path: apps/trade_import
          token: ${{ secrets.APPS_READ_TOKEN }}

      - name: Checkout bangicode_brand
        uses: actions/checkout@v6
        with:
          repository: r0b0t007/bangicode_brand
          path: apps/bangicode_brand
          token: ${{ secrets.APPS_READ_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-16 erpnext
          bench get-app morocco_localization $GITHUB_WORKSPACE/apps/morocco_localization
          bench get-app trade_import $GITHUB_WORKSPACE/apps/trade_import
          bench get-app bangicode_brand $GITHUB_WORKSPACE/apps/bangicode_brand
          bench get-app marone_custom $GITHUB_WORKSPACE/apps/marone_custom
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%' test_site
          bench --site test_site install-app marone_custom
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app marone_custom
        env:
          TYPE: server
